    /* 기본 디자인 */
    * {

    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo",
                   sans-serif;
      color: #263653;
      background: linear-gradient(
        180deg,
        #a9e7ff 0%,
        #e0f8ff 48%,
        #d5f5c6 100%
      );
      overflow-x: hidden;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .cloud {
      position: fixed;
      z-index: 0;
      font-size: 70px;
      opacity: 0.55;
      pointer-events: none;
      animation: float 5s ease-in-out infinite;
    }

    .cloud.one {
      top: 45px;
      left: 3%;
    }

    .cloud.two {
      top: 150px;
      right: 3%;
      animation-delay: 1.5s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: min(92%, 760px);
      margin: 0 auto;
      padding: 38px 0 50px;
      text-align: center;
    }

    .logo {
      display: inline-block;
      padding: 9px 18px;
      border: 2px solid white;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.65);
      font-size: 15px;
      font-weight: 800;
      color: #347b8d;
    }

    h1 {
      margin: 20px 0 12px;
      font-size: clamp(30px, 6vw, 46px);
      line-height: 1.3;
      color: #24486c;
      letter-spacing: -1.5px;
    }

    .subtitle {
      margin: 0 auto 28px;
      font-size: 17px;
      line-height: 1.8;
      color: #45677d;
      word-break: keep-all;
    }

    .main-card {
      padding: clamp(20px, 5vw, 34px);
      border: 4px solid white;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 12px 0 rgba(68, 137, 151, 0.13),
                  0 18px 35px rgba(47, 99, 130, 0.10);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 25px;
      color: #315477;
    }

    .hint {
      margin: 0 0 22px;
      color: #718397;
      font-size: 15px;
      line-height: 1.6;
    }

    /* MBTI 선택 버튼 */
    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .mbti-btn {
      min-height: 62px;
      padding: 12px 4px;
      border: 2px solid #d4eafa;
      border-radius: 17px;
      background: #f5fbff;
      color: #345b80;
      font-size: 18px;
      font-weight: 800;
      transition: transform 0.18s, background 0.18s,
                  border-color 0.18s, box-shadow 0.18s;
    }

    .mbti-btn:hover,
    .mbti-btn:focus-visible {
      transform: translateY(-4px);
      border-color: #6ac7e8;
      background: #dff6ff;
      box-shadow: 0 5px 0 #b6e4f2;
      outline: none;
    }

    /* 결과 화면 */
    #result {
      display: none;
      animation: appear 0.45s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-label {
      display: inline-block;
      padding: 8px 17px;
      border-radius: 25px;
      background: #e2f7d9;
      color: #397e48;
      font-size: 15px;
      font-weight: 800;
    }

    .pokemon-emoji {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 185px;
      height: 185px;
      margin: 22px auto;
      border: 5px solid #fff;
      border-radius: 50%;
      background: linear-gradient(145deg, #e4faff, #dff5ce);
      box-shadow: 0 8px 0 #d0e9e4;
      font-size: 105px;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-9px) rotate(3deg); }
    }

    .pokemon-name {
      margin: 0;
      font-size: clamp(32px, 7vw, 43px);
      color: #2d5279;
    }

    .pokemon-type {
      margin: 10px 0 20px;
      color: #7290a4;
      font-size: 16px;
      font-weight: 700;
    }

    .reason-box {
      margin: 20px 0;
      padding: 20px;
      border-radius: 20px;
      background: #f2faff;
      text-align: left;
    }

    .reason-box h3 {
      margin: 0 0 12px;
      color: #347b99;
      font-size: 19px;
    }

    .reason-box p {
      margin: 8px 0;
      font-size: 16px;
      line-height: 1.8;
      word-break: keep-all;
    }

    .compatibility {
      padding: 19px;
      border: 2px dashed #b8dfaa;
      border-radius: 20px;
      background: #f4ffed;
    }

    .compatibility .label {

    }

    }

    .compatibility .description {

      font-size: 15px;

    }

    .restart-btn {

      border: none;
      border-radius: 18px;
      background: #428cc5;
      color: white;
      font-size: 18px;
      font-weight: 800;

    }

    .restart-btn:hover {

    }

    }

    .footer {
      margin-top: 28px;
      color: #577b8b;
      font-size: 13px;
      line-height: 1.8;
    }

      }

      }

      .cloud {
        font-size: 48px;
      }
    }
  </style>
</head>
